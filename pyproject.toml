[project]
name = "prospace"
version = "0.1.0"
description = "ProSpace — биржа фриланса"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.161.1",
    "jinja2>=3.1.6",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.16.1",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "aiosmtplib>=5.1.3",
    "celery>=5.6.3",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "anthropic>=2.2.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
